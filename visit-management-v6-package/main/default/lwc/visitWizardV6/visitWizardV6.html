<template>
    <lightning-quick-action-panel header={panelHeader}>
        <template if:true={isBusy}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>

        <template if:true={errorMessage}>
            <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium" role="alert">
                <span>{errorMessage}</span>
            </div>
        </template>

        <div class="wizard" data-source-account-id={accountId}>
            <template if:true={canEdit}>
                <div class="stepbar stepbar_v6 slds-m-bottom_medium">
                    <template for:each={steps} for:item="stepItem">
                        <div key={stepItem.value} class={stepItem.className}>
                            <span class="step-number">{stepItem.number}</span>
                            <span class="step-label">{stepItem.label}</span>
                        </div>
                    </template>
                </div>
            </template>

            <template if:true={isRecordTypeStep}>
                <section>
                    <lightning-radio-group
                        name="visitRecordType"
                        label="Visit Record Type"
                        options={recordTypeOptions}
                        value={selectedRecordTypeId}
                        type="button"
                        onchange={handleRecordTypeSelect}
                    ></lightning-radio-group>
                </section>
            </template>

            <template if:true={selectedRecordTypeId}>
                <section class={visitDetailSectionClass}>
                    <h2 class="slds-text-heading_small slds-m-bottom_small">Visit Details</h2>
                    <template if:true={visitDetailLoading}>
                        <div class="inline-loading" aria-live="polite">
                            <lightning-spinner alternative-text="Loading Visit details" size="small"></lightning-spinner>
                            <span>Loading Visit details</span>
                        </div>
                    </template>
                    <div class="form-grid slds-m-bottom_small">
                        <div class="lookup-row">
                            <lightning-input
                                label="Account"
                                value={accountDisplayValue}
                                required
                                disabled
                            ></lightning-input>
                            <lightning-button label="Change" onclick={openAccountModal}></lightning-button>
                        </div>
                        <div class="lookup-row">
                            <lightning-input
                                label="Place"
                                value={placeLookupDisplayValue}
                                required
                                disabled
                            ></lightning-input>
                            <lightning-button label="Search" disabled={placeSearchDisabled} onclick={openAddressModal}></lightning-button>
                        </div>
                        <template if:true={showEditableAccountCanOutput}>
                            <lightning-record-form
                                object-api-name="Account"
                                record-id={accountId}
                                fields={accountCanFields}
                                columns="1"
                                mode="readonly"
                            ></lightning-record-form>
                        </template>
                    </div>
                    <lightning-record-edit-form
                        class={visitFormClass}
                        object-api-name="Visit"
                        record-id={visitRecordIdForForm}
                        record-type-id={selectedRecordTypeId}
                        onload={handleVisitFormLoad}
                    >
                        <lightning-messages></lightning-messages>
                        <div class="form-grid">
                            <template for:each={visitFields} for:item="field">
                                <lightning-input-field
                                    key={field.apiName}
                                    data-visit-field
                                    data-field={field.apiName}
                                    field-name={field.apiName}
                                    required={field.required}
                                    value={field.value}
                                    onchange={handleVisitFieldChange}
                                ></lightning-input-field>
                            </template>
                        </div>
                    </lightning-record-edit-form>
                </section>
            </template>

            <template if:true={isVisitorStep}>
                <section>
                    <div class="section-header">
                        <h2 class="slds-text-heading_small">Visitors</h2>
                        <lightning-button label="Add" icon-name="utility:add" onclick={openUserModal}></lightning-button>
                    </div>

                    <div class="slds-m-bottom_medium">
                        <h3 class="slds-text-title_bold slds-m-bottom_x-small">Account Team</h3>
                        <lightning-datatable
                            key-field="userId"
                            data={visitorCandidates}
                            columns={visitorCandidateColumns}
                            selected-rows={selectedVisitorIds}
                            disabled-rows={lockedVisitorIds}
                            onrowselection={handleVisitorCandidateSelection}
                        ></lightning-datatable>
                    </div>

                    <h3 class="slds-text-title_bold slds-m-bottom_x-small">Selected Visitors</h3>
                    <template if:true={hasSelectedVisitors}>
                        <lightning-datatable
                            key-field="userId"
                            data={selectedVisitors}
                            columns={selectedVisitorColumns}
                            hide-checkbox-column
                            onrowaction={handleSelectedVisitorRowAction}
                        ></lightning-datatable>
                    </template>
                    <template if:false={hasSelectedVisitors}>
                        <div class="empty-state">No visitors selected.</div>
                    </template>
                </section>
            </template>

            <template if:true={isVisitedPartyStep}>
                <section>
                    <div class="section-header">
                        <h2 class="slds-text-heading_small">Visited Parties</h2>
                        <lightning-button-group>
                            <lightning-button label="Add" icon-name="utility:add" onclick={openContactModal}></lightning-button>
                            <lightning-button label="Create Contact" icon-name="utility:new" onclick={openCreateContact}></lightning-button>
                        </lightning-button-group>
                    </div>
                    <h3 class="slds-text-title_bold slds-m-bottom_x-small">Visited Parties</h3>
                    <template if:true={hasSelectedContacts}>
                        <lightning-datatable
                            key-field="contactId"
                            data={selectedContacts}
                            columns={selectedContactColumns}
                            hide-checkbox-column
                            onrowaction={handleSelectedContactRowAction}
                        ></lightning-datatable>
                    </template>
                    <template if:false={hasSelectedContacts}>
                        <div class="empty-state">No visited parties selected.</div>
                    </template>
                </section>
            </template>

            <template if:true={isActionPlanStep}>
                <section>
                    <div class="section-header">
                        <h2 class="slds-text-heading_small">Meeting Template</h2>
                        <lightning-input
                            type="checkbox"
                            label="Create Meeting Template"
                            checked={createActionPlan}
                            disabled={actionPlanCreationLocked}
                            onchange={handleCreateActionPlanChange}
                        ></lightning-input>
                    </div>

                    <template if:true={createActionPlan}>
                        <div class="form-grid">
                            <lightning-input
                                data-action-plan-field
                                data-field="actionPlanName"
                                type="text"
                                label="Name"
                                value={actionPlanName}
                                required
                                onchange={handleActionPlanFieldChange}
                            ></lightning-input>
                            <lightning-input
                                data-action-plan-field
                                data-field="actionPlanStartDate"
                                type="date"
                                label="Start Date"
                                value={actionPlanStartDate}
                                required
                                onchange={handleActionPlanFieldChange}
                            ></lightning-input>
                            <template if:true={hasCreatedVisitId}>
                                <lightning-record-form
                                    object-api-name="Visit"
                                    record-id={createdVisitId}
                                    fields={visitNameFields}
                                    columns="1"
                                    mode="readonly"
                                ></lightning-record-form>
                            </template>
                            <template if:false={hasCreatedVisitId}>
                                <lightning-input type="text" label="Target Record" value={actionPlanTargetDisplayValue} disabled></lightning-input>
                            </template>
                            <lightning-combobox
                                data-action-plan-field
                                data-field="actionPlanStatus"
                                label="Status"
                                value={actionPlanStatus}
                                options={actionPlanStatusOptions}
                                required
                                onchange={handleActionPlanFieldChange}
                            ></lightning-combobox>
                        </div>

                        <section class="action-plan-template-section slds-m-top_large">
                            <h3 class="slds-text-title_bold slds-m-bottom_small">Meeting Template</h3>
                            <lightning-record-picker
                                data-action-plan-field
                                data-action-plan-template-picker
                                label="Meeting Template"
                                object-api-name="ActionPlanTemplateVersion"
                                value={actionPlanTemplateVersionId}
                                filter={actionPlanTemplatePickerFilter}
                                display-info={actionPlanTemplateDisplayInfo}
                                matching-info={actionPlanTemplateMatchingInfo}
                                required
                                onchange={handleActionPlanTemplateLookupChange}
                            ></lightning-record-picker>

                            <template if:true={hasRecentActionPlanTemplates}>
                                <div class="slds-m-top_medium">
                                    <h4 class="slds-text-title slds-m-bottom_x-small">Recent Meeting Templates</h4>
                                    <lightning-datatable
                                        key-field="templateVersionId"
                                        data={recentActionPlanTemplates}
                                        columns={recentActionPlanTemplateColumns}
                                        hide-checkbox-column
                                        onrowaction={handleRecentTemplateRowAction}
                                    ></lightning-datatable>
                                </div>
                            </template>
                        </section>
                    </template>
                </section>
            </template>

            <template if:true={isTaskListStep}>
                <section>
                    <div class="section-header">
                        <h2 class="slds-text-heading_small">Topics</h2>
                        <lightning-button
                            label="New Topic"
                            icon-name="utility:add"
                            disabled={isBusy}
                            onclick={openTopicModal}
                        ></lightning-button>
                    </div>
                    <template if:true={hasTasks}>
                        <lightning-datatable
                            key-field="genericTaskId"
                            data={tasks}
                            columns={taskColumns}
                            hide-checkbox-column
                            onrowaction={handleTaskRowAction}
                        ></lightning-datatable>
                    </template>
                    <template if:false={hasTasks}>
                        <div class="empty-state">No topics were imported for this Visit.</div>
                    </template>
                </section>
            </template>

            <template if:true={isTaskDetailStep}>
                <section>
                    <h2 class="slds-text-heading_small slds-m-bottom_small">{activeTask.name}</h2>
                    <div class="form-grid">
                        <template if:true={hasCreatedVisitId}>
                            <lightning-record-form
                                object-api-name="Visit"
                                record-id={createdVisitId}
                                fields={visitNameFields}
                                columns="1"
                                mode="readonly"
                            ></lightning-record-form>
                        </template>
                        <template if:false={hasCreatedVisitId}>
                            <lightning-input type="text" label="Visit" value={visitDisplayValue} disabled></lightning-input>
                        </template>
                        <lightning-input type="text" label="Status" value={activeTask.displayStatus} disabled></lightning-input>
                        <lightning-input
                            data-field="description"
                            type="text"
                            label="Topic Details"
                            value={activeTask.description}
                            onchange={handleTaskFieldChange}
                        ></lightning-input>
                        <lightning-input
                            data-field="startDateTime"
                            data-task-start
                            type="datetime"
                            label="Start Date Time"
                            value={activeTask.startDateTime}
                            required
                            onchange={handleTaskFieldChange}
                        ></lightning-input>
                        <lightning-input
                            data-field="endDateTime"
                            data-task-end
                            type="datetime"
                            label="End Date Time"
                            value={activeTask.endDateTime}
                            min={taskEndDateTimeMin}
                            required
                            message-when-range-underflow="End Date Time must be after Start Date Time."
                            onchange={handleTaskFieldChange}
                        ></lightning-input>
                    </div>
                    <template if:true={activeTaskIsSales}>
                        <lightning-button
                            class="slds-m-top_medium"
                            label="Create Opportunity"
                            icon-name="utility:new"
                            onclick={openOpportunityModal}
                        ></lightning-button>
                    </template>
                    <section class="notes-section slds-m-top_large">
                        <h3 class="slds-text-title_bold slds-m-bottom_small">Notes</h3>
                        <div class="note-composer">
                            <lightning-input
                                type="text"
                                label="Note Title"
                                value={taskNoteTitle}
                                onchange={handleTaskNoteTitleChange}
                            ></lightning-input>
                            <lightning-input-rich-text
                                label="Note"
                                value={taskNoteBody}
                                required
                                onchange={handleTaskNoteBodyChange}
                            ></lightning-input-rich-text>
                            <lightning-button
                                label="Save Note"
                                icon-name="utility:save"
                                disabled={taskNoteSaveDisabled}
                                onclick={handleTaskNoteSave}
                            ></lightning-button>
                        </div>
                        <template if:true={hasTaskNotes}>
                            <div class="note-list">
                                <template for:each={taskNotes} for:item="note">
                                    <article key={note.contentNoteId} class="note-item">
                                        <div class="note-title">{note.title}</div>
                                        <div class="note-meta">{note.createdByName}</div>
                                        <lightning-formatted-rich-text value={note.body}></lightning-formatted-rich-text>
                                    </article>
                                </template>
                            </div>
                        </template>
                        <template if:false={hasTaskNotes}>
                            <div class="empty-state slds-m-top_small">No notes have been captured for this topic.</div>
                        </template>
                    </section>
                </section>
            </template>

            <template if:true={isReviewStep}>
                <section>
                    <h2 class="slds-text-heading_small slds-m-bottom_medium">Review</h2>
                    <div class="review-grid">
                        <section>
                            <h3 class="slds-text-title_bold">Visit Details</h3>
                            <template if:true={hasCreatedVisitId}>
                                <lightning-record-form
                                    object-api-name="Visit"
                                    record-id={createdVisitId}
                                    fields={visitReviewFields}
                                    columns="1"
                                    mode="readonly"
                                ></lightning-record-form>
                            </template>
                            <template if:false={hasCreatedVisitId}>
                                <div class="empty-state">{visitDisplayValue}</div>
                            </template>
                        </section>
                        <section>
                            <h3 class="slds-text-title_bold">Meeting Template</h3>
                            <template if:true={hasActionPlanId}>
                                <lightning-record-form
                                    object-api-name="ActionPlan"
                                    record-id={actionPlanId}
                                    fields={actionPlanReviewFields}
                                    columns="1"
                                    mode="readonly"
                                ></lightning-record-form>
                            </template>
                            <template if:false={hasActionPlanId}>
                                <div class="empty-state">No Meeting Template selected.</div>
                            </template>
                        </section>
                        <section>
                            <h3 class="slds-text-title_bold">Visitors</h3>
                            <template for:each={selectedVisitors} for:item="visitor">
                                <div key={visitor.userId}>{visitor.name}</div>
                            </template>
                        </section>
                        <section>
                            <h3 class="slds-text-title_bold">Attendees</h3>
                            <template for:each={selectedContacts} for:item="contact">
                                <div key={contact.contactId}>{contact.name}</div>
                            </template>
                        </section>
                    </div>

                    <div class="slds-m-top_large">
                        <h3 class="slds-text-title_bold slds-m-bottom_x-small">Topic Snapshot</h3>
                        <template if:true={hasTasks}>
                            <lightning-datatable key-field="genericTaskId" data={tasks} columns={reviewTaskColumns} hide-checkbox-column></lightning-datatable>
                        </template>
                        <template if:false={hasTasks}>
                            <div class="empty-state">No topics on this Visit.</div>
                        </template>
                    </div>

                    <div class="slds-m-top_large">
                        <h3 class="slds-text-title_bold slds-m-bottom_x-small">Related Opportunities</h3>
                        <template if:true={hasOpportunities}>
                            <lightning-datatable key-field="opportunityId" data={opportunities} columns={opportunityColumns} hide-checkbox-column></lightning-datatable>
                        </template>
                        <template if:false={hasOpportunities}>
                            <div class="empty-state">No Opportunity was created from this Visit flow.</div>
                        </template>
                    </div>
                </section>
            </template>
        </div>

        <div slot="footer">
            <template if:true={showPrevious}>
                <lightning-button label="Previous" onclick={handlePrevious}></lightning-button>
            </template>
            <template if:true={showSaveForLater}>
                <lightning-button label="Save for Later" class="slds-m-left_x-small" disabled={isBusy} onclick={handleSaveForLater}></lightning-button>
            </template>
            <template if:true={isVisitDetailStep}>
                <lightning-button variant="brand" label="Next" class="slds-m-left_x-small" disabled={isBusy} onclick={handleVisitDetailNext}></lightning-button>
            </template>
            <template if:true={isVisitorStep}>
                <lightning-button variant="brand" label="Next" class="slds-m-left_x-small" disabled={isBusy} onclick={handleVisitorNext}></lightning-button>
            </template>
            <template if:true={isVisitedPartyStep}>
                <lightning-button variant="brand" label="Next" class="slds-m-left_x-small" disabled={isBusy} onclick={handleVisitedPartyNext}></lightning-button>
            </template>
            <template if:true={isActionPlanStep}>
                <lightning-button variant="brand" label="Next" class="slds-m-left_x-small" disabled={isBusy} onclick={handleActionPlanNext}></lightning-button>
            </template>
            <template if:true={isTaskListStep}>
                <template if:true={requiredTasksComplete}>
                    <lightning-button variant="brand" label="Next" class="slds-m-left_x-small" disabled={isBusy} onclick={handleTasksNext}></lightning-button>
                </template>
            </template>
            <template if:true={isTaskDetailStep}>
                <lightning-button label="Back to Topics" onclick={handleTaskSave}></lightning-button>
                <lightning-button variant="brand" label="Complete Topic" class="slds-m-left_x-small" disabled={taskCompleteDisabled} onclick={handleTaskComplete}></lightning-button>
            </template>
            <template if:true={isReviewStep}>
                <template if:true={canEdit}>
                    <lightning-button variant="brand" label="Complete" class="slds-m-left_x-small" disabled={isBusy} onclick={handleCompleteVisit}></lightning-button>
                </template>
            </template>
        </div>
    </lightning-quick-action-panel>

    <template if:true={showAccountModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container modal-wide">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={closeAccountModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-text-heading_medium">Select Account</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <div class="lookup-row">
                        <lightning-input
                            type="search"
                            label="Search by Account Name, Customer Account Number, or Old Dealer Code"
                            value={accountSearchTerm}
                            onchange={handleAccountSearchTermChange}
                            onkeyup={handleAccountSearchKeyup}
                        ></lightning-input>
                        <lightning-button label="Search" onclick={runAccountSearch}></lightning-button>
                    </div>
                    <div class="slds-m-top_medium">
                        <template if:true={hasAccountSearchResults}>
                            <lightning-datatable
                                key-field="accountId"
                                data={accountSearchResults}
                                columns={accountSearchColumns}
                                hide-checkbox-column
                                onrowaction={handleAccountSearchRowAction}
                            ></lightning-datatable>
                        </template>
                        <template if:false={hasAccountSearchResults}>
                            <div class="empty-state">No accounts found.</div>
                        </template>
                    </div>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeAccountModal}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={showAddressModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container modal-wide">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={closeAddressModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-text-heading_medium">Select Account Address</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <div class="lookup-row">
                        <lightning-input
                            type="search"
                            label="Search Address"
                            value={addressSearchTerm}
                            onchange={handleAddressSearchTermChange}
                            onkeyup={handleAddressSearchKeyup}
                        ></lightning-input>
                        <lightning-button label="Search" onclick={runAddressSearch}></lightning-button>
                    </div>
                    <div class="slds-m-top_medium">
                        <template if:true={hasAddressSearchResults}>
                            <lightning-datatable
                                key-field="addressId"
                                data={addressSearchResults}
                                columns={addressSearchColumns}
                                hide-checkbox-column
                                onrowaction={handleAddressSearchRowAction}
                            ></lightning-datatable>
                        </template>
                        <template if:false={hasAddressSearchResults}>
                            <div class="empty-state">No addresses found.</div>
                        </template>
                    </div>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeAddressModal}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={showUserModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={closeUserModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-text-heading_medium">Add Visitor</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <div class="lookup-row">
                        <lightning-input
                            type="search"
                            label="Search Active Users"
                            value={userSearchTerm}
                            onchange={handleUserSearchTermChange}
                            onkeyup={handleUserSearchKeyup}
                        ></lightning-input>
                        <lightning-button label="Search" disabled={userSearchDisabled} onclick={runUserSearch}></lightning-button>
                    </div>
                    <div class="slds-m-top_medium">
                        <h3 class="slds-text-title_bold slds-m-bottom_x-small">Active Users</h3>
                        <template if:true={hasUserSearchResults}>
                            <lightning-datatable key-field="userId" data={userSearchResults} columns={userSearchColumns} hide-checkbox-column onrowaction={handleUserSearchRowAction}></lightning-datatable>
                        </template>
                        <template if:false={hasUserSearchResults}>
                            <div class="empty-state">{userSearchEmptyMessage}</div>
                        </template>
                    </div>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Done" onclick={closeUserModal}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={showContactModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container modal-wide">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={closeContactModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-text-heading_medium">Add Visited Party</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <div class="lookup-row">
                        <lightning-input type="search" label="Search Account Contacts" value={contactSearchTerm} onchange={handleContactSearchTermChange} onkeyup={handleContactSearchKeyup}></lightning-input>
                        <lightning-button label="Search" onclick={runContactSearch}></lightning-button>
                    </div>
                    <div class="slds-m-top_medium">
                        <template if:true={hasContactSearchResults}>
                            <lightning-datatable key-field="contactId" data={contactSearchResults} columns={contactSearchColumns} hide-checkbox-column onrowaction={handleContactSearchRowAction}></lightning-datatable>
                        </template>
                        <template if:false={hasContactSearchResults}>
                            <div class="empty-state">No account contacts found.</div>
                        </template>
                    </div>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Done" onclick={closeContactModal}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={showContactRecordTypeModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container modal-medium contact-record-type-modal">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={closeContactRecordTypeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-text-heading_medium">Contact Record Type</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <table class="record-type-table" aria-label="Contact Record Types">
                        <colgroup>
                            <col class="record-type-name-col" />
                            <col class="record-type-description-col" />
                        </colgroup>
                        <thead>
                            <tr>
                                <th class="record-type-name-header" scope="col">Recordtype name</th>
                                <th class="record-type-description-header" scope="col">Description of that recordtype</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={contactRecordTypeChoices} for:item="recordType">
                                <tr key={recordType.value} class={recordType.className}>
                                    <td class="record-type-name-cell">
                                        <button
                                            type="button"
                                            class={recordType.buttonClass}
                                            data-id={recordType.value}
                                            onclick={handleContactRecordTypeChange}
                                        >
                                            {recordType.label}
                                        </button>
                                    </td>
                                    <td class="record-type-description-cell">{recordType.description}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeContactRecordTypeModal}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={showCreateContactModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container modal-wide">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={closeCreateContactModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-text-heading_medium">{createContactModalTitle}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-record-edit-form
                        data-create-contact-form
                        object-api-name="Contact"
                        record-type-id={newContactRecordTypeId}
                        onsubmit={handleCreateContactSubmit}
                        onsuccess={handleCreateContactSuccess}
                        onerror={handleCreateContactError}
                    >
                        <lightning-messages></lightning-messages>
                        <template if:true={contactLayoutLoading}>
                            <div class="inline-loading" aria-live="polite">
                                <lightning-spinner alternative-text="Loading Contact layout" size="small"></lightning-spinner>
                                <span>Loading Contact layout</span>
                            </div>
                        </template>
                        <template if:true={hasContactLayoutSections}>
                            <template for:each={contactLayoutSections} for:item="section">
                                <section key={section.id} class="contact-layout-section">
                                    <h3 class="slds-text-title_bold slds-m-bottom_small">{section.heading}</h3>
                                    <template for:each={section.rows} for:item="row">
                                        <div key={row.id} class="form-grid contact-layout-row">
                                            <template for:each={row.fields} for:item="field">
                                                <lightning-input-field
                                                    key={field.id}
                                                    field-name={field.apiName}
                                                    value={field.value}
                                                    required={field.required}
                                                    disabled={field.disabled}
                                                ></lightning-input-field>
                                            </template>
                                        </div>
                                    </template>
                                </section>
                            </template>
                        </template>
                        <div class="slds-modal__footer inline-form-footer">
                            <lightning-button label="Cancel" onclick={closeCreateContactModal}></lightning-button>
                            <lightning-button type="submit" variant="brand" label="Save" disabled={createContactSaveDisabled} class="slds-m-left_x-small"></lightning-button>
                        </div>
                    </lightning-record-edit-form>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={showTopicModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={closeTopicModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-text-heading_medium">New Topic</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <div class="form-grid">
                        <lightning-input
                            data-new-topic-field
                            data-field="name"
                            type="text"
                            label="Topic Name"
                            value={newTopicForm.name}
                            required
                            onchange={handleNewTopicFieldChange}
                        ></lightning-input>
                        <lightning-input
                            data-field="required"
                            type="checkbox"
                            label="Required"
                            checked={newTopicForm.required}
                            onchange={handleNewTopicFieldChange}
                        ></lightning-input>
                        <lightning-textarea
                            data-field="description"
                            label="Topic Details"
                            value={newTopicForm.description}
                            onchange={handleNewTopicFieldChange}
                        ></lightning-textarea>
                    </div>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeTopicModal}></lightning-button>
                    <lightning-button
                        variant="brand"
                        label="Save"
                        class="slds-m-left_x-small"
                        disabled={newTopicSaveDisabled}
                        onclick={handleNewTopicSubmit}
                    ></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={showOpportunityModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={closeOpportunityModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-text-heading_medium">Create Opportunity</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <div class="form-grid">
                        <template if:true={hasCreatedVisitId}>
                            <lightning-record-form
                                object-api-name="Visit"
                                record-id={createdVisitId}
                                fields={visitNameFields}
                                columns="1"
                                mode="readonly"
                            ></lightning-record-form>
                        </template>
                        <template if:true={hasAccountId}>
                            <lightning-record-form
                                object-api-name="Account"
                                record-id={accountId}
                                fields={accountNameFields}
                                columns="1"
                                mode="readonly"
                            ></lightning-record-form>
                        </template>
                        <lightning-input data-opportunity-field data-field="name" type="text" label="Opportunity Name" value={opportunityForm.name} required onchange={handleOpportunityFieldChange}></lightning-input>
                        <lightning-input type="text" label="Stage" value={opportunityForm.stageName} disabled></lightning-input>
                        <lightning-input data-opportunity-field data-field="closeDate" type="date" label="Close Date" value={opportunityForm.closeDate} required onchange={handleOpportunityFieldChange}></lightning-input>
                        <lightning-input data-field="amount" type="number" label="Amount" value={opportunityForm.amount} onchange={handleOpportunityFieldChange}></lightning-input>
                        <lightning-input data-field="type" type="text" label="Type" value={opportunityForm.type} onchange={handleOpportunityFieldChange}></lightning-input>
                        <lightning-input data-field="description" type="text" label="Description" value={opportunityForm.description} onchange={handleOpportunityFieldChange}></lightning-input>
                    </div>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeOpportunityModal}></lightning-button>
                    <lightning-button variant="brand" label="Submit" class="slds-m-left_x-small" onclick={handleOpportunitySubmit}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
